name: Deploy All Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      # Build Cascade CMS Wiki
      - name: Install Cascade CMS dependencies
        run: pip install -r ./wiki/cascade-cms-wiki/requirements.txt

      - name: Build Cascade CMS Wiki
        run: |
          cd ./wiki/cascade-cms-wiki/
          properdocs build
          cd ..

      # Build Other Project (if it has docs)
      - name: Install Other Project dependencies
        run: |
          if [ -f "other-project/requirements.txt" ]; then
            pip install -r other-project/requirements.txt
          fi

      - name: Build Other Project
        run: |
          if [ -f "other-project/properdocs.yml" ]; then
            cd other-project
            properdocs build
            cd ..
          fi

      # Build the plain root/wiki hub pages
      - name: Install root site dependencies
        run: pip install markdown

      - name: Build root and wiki hub pages
        run: python build_root_site.py

      # Combine all site outputs
      - name: Combine documentation sites
        run: |
          mkdir -p combined-site/wiki/cascade-cms-wiki
          cp -r ./wiki/cascade-cms-wiki/site/* combined-site/wiki/cascade-cms-wiki/
          if [ -d "other-project/site" ]; then
            mkdir -p combined-site/other-project
            cp -r other-project/site/* combined-site/other-project/
          fi

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
