name: Deploy All Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build documentation projects
        run: |
          for project_dir in $(find ./wiki -maxdepth 2 -name "properdocs.yml" -exec dirname {} \;); do
            cd "$project_dir"
            if [ -f "requirements.txt" ]; then pip install -r requirements.txt
            else pip install properdocs; fi
            properdocs build
            cd - > /dev/null
          done

      # Build the plain root/wiki hub pages
      - name: Install root site dependencies
        run: pip install markdown

      - name: Build root and wiki hub pages
        run: python build_root_site.py

      # Combine all site outputs
      - name: Combine documentation sites
        run: |
          mkdir -p combined-site/wiki
          if [ -f "wiki/index.md" ]; then cp wiki/index.md combined-site/wiki/index.md; fi
          for project_dir in $(find ./wiki -maxdepth 2 -name "properdocs.yml" -exec dirname {} \;); do
            project_name=$(basename "$project_dir")
            if [ -d "$project_dir/site" ]; then
              mkdir -p "combined-site/wiki/$project_name"
              cp -r "$project_dir/site/"* "combined-site/wiki/$project_name/"
            fi
          done

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
