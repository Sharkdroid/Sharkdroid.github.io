site_name: Cascade CMS REST Client 
site_author: Keith Shark
site_description: Unified documentation for py-cascade-cms

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - minify
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - md_in_html

nav:
  - Home: ./index.md
  - Operations: ./operations/operations.md
  - CMS Types: ./operations/cmstypes.md
  - Wrapper: ./operations/wrapper.md
  - Driver: ./operations/driver.md
  - Operation Logger: ./operations/operation_logger.md
